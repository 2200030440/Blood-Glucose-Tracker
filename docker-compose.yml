version: '3.8'

services:
  sweety-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sweety-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://sweety_user:sweety_secure_password@postgres:5432/sweety_db
      - JWT_SECRET=sweety_jwt_production_docker_secret_key_2026
      - JWT_EXPIRES_IN=7d
      - COOKIE_SECRET=sweety_cookie_production_docker_key_2026
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npm run prisma:migrate && node server/prisma/seed.js && npm run start"

  postgres:
    image: postgres:16-alpine
    container_name: sweety-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sweety_user
      POSTGRES_PASSWORD: sweety_secure_password
      POSTGRES_DB: sweety_db
    ports:
      - "5432:5432"
    volumes:
      - sweety_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety_user -d sweety_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sweety_pgdata:

