services:
  - type: web
    name: sweety-app
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run prisma:generate && npm run prisma:migrate && node server/prisma/seed.js && node server/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sweety-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true

databases:
  - name: sweety-db
    plan: free
    databaseName: sweety_db
    user: sweety_user

